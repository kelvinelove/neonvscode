name: Publish to Open VSX (Trusted Publisher)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build --if-present

      - name: Package extension
        run: npx vsce package --out extension.vsix

      - name: Publish to Open VSX
        uses: eclipse-openvsx/publish@v1
        with:
          extensionFile: extension.vsix